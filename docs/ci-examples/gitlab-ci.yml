# Example GitLab CI job that runs `spectastic validate` and exposes
# the SARIF report as a SAST artifact. GitLab renders findings inline
# on the Merge Request diff and on the Security Dashboard.
#
# Copy into .gitlab-ci.yml at your project root (or include from there).

stages:
  - validate

spec-validate:
  stage: validate
  image: node:20-alpine
  script:
    - npx @spectastic/cli validate
        --format sarif
        "specs/**/*.html" "principles.html" "examples/**/*.html"
        > spectastic.sarif
  artifacts:
    when: always
    reports:
      # GitLab understands SARIF as a SAST report; findings appear on
      # the MR security widget and on the Security Dashboard.
      sast: spectastic.sarif
    paths:
      - spectastic.sarif
  # Don't fail the pipeline yet — surface findings for review first.
  # Flip to `allow_failure: false` once your repo is clean.
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
