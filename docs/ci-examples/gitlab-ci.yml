# Example GitLab CI job rendered by the same renderer `spectastic init --tools`
# installs. Copy this file into .gitlab/ci/ and include it from .gitlab-ci.yml, or
# run that command to keep it managed and drift-checked instead.
spectastic-gate:
  stage: .pre
  image: node:22
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - FAILED=""
    - npx --yes @spectastic/cli@latest validate --format sarif 'specs/**/*.html' '*.html' 'examples/*.html' > spectastic.sarif || FAILED=1
    - npx --yes @spectastic/cli@latest enforce || FAILED=1
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        BASE="$(git merge-base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" HEAD)"
        CHANGED="$(git diff --name-only "$BASE" HEAD)"
        if [ -n "$CHANGED" ]; then
          # one path per word; paths containing whitespace are not supported here
          npx --yes @spectastic/cli@latest verdict --changed $CHANGED --out .spectastic/verdict.json || FAILED=1
        fi
      fi
    - test -z "$FAILED"
  artifacts:
    when: always
    reports:
      sarif: spectastic.sarif
    paths:
      - spectastic.sarif
      - .spectastic/verdict.json
