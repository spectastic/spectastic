packages:
  - 'packages/*'

# pnpm 10+ blocks dependency build scripts by default and hard-fails in CI
# (ERR_PNPM_IGNORED_BUILDS) until told which to allow. pnpm 11 reads this map
# from here (not package.json's `pnpm` field). esbuild is allowed (tsup builds
# with it). @vscode/vsce-sign and keytar are vscode-only native/signing tools
# the npm publish never needs, so their build scripts are skipped rather than
# run on the runner.
allowBuilds:
  esbuild: true
  '@vscode/vsce-sign': false
  keytar: false
