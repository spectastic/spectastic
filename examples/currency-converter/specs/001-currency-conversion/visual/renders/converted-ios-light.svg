<svg xmlns="http://www.w3.org/2000/svg" width="200" height="360" viewBox="0 0 200 360" role="img"
     aria-label="Converter screen, converted state, light mode, iPhone: one hundred pounds converts to one hundred and twenty-seven dollars sixty, with the rate labelled four minutes old">
  <!-- A render is EVIDENCE of one cell of the grid, and it deliberately does not
       follow the reader's theme: it is evidence of light mode, and restyling it
       would destroy the thing it is evidence of. A diagram would follow the
       theme; the two look identical and want opposite treatment. -->
  <rect x="0" y="0" width="200" height="360" rx="18" fill="#ffffff" stroke="#d1d1d6"/>
  <text x="16" y="34" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#000000">Convert</text>
  <rect x="12" y="48" width="176" height="56" rx="10" fill="#f2f2f7"/>
  <text x="24" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#8e8e93">GBP</text>
  <text x="24" y="92" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#000000">100.00</text>
  <text x="24" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#8e8e93">USD</text>
  <text x="24" y="152" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#000000">127.60</text>
  <text x="24" y="176" font-family="system-ui, sans-serif" font-size="11" fill="#8e8e93">1 GBP = 1.2760 USD · 4 min ago</text>
  <rect x="12" y="300" width="176" height="44" rx="22" fill="#007aff"/>
  <text x="100" y="327" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Refresh</text>
</svg>
