<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Canvas test harness</title>
<link rel="stylesheet" href="/packages/vscode/dist/webview.css">
<script>
  // Stub the VS Code webview API before the bundle loads (main.ts calls it at
  // module init). Records outbound messages so tests can assert click → open.
  window.__posted = [];
  window.acquireVsCodeApi = () => ({
    postMessage: (m) => { window.__posted.push(m); },
    getState: () => undefined,
    setState: () => undefined,
  });
</script>
</head>
<body class="vscode-light">
<div id="canvas-root"></div>
<script src="/packages/vscode/dist/webview.global.js"></script>
</body>
</html>
