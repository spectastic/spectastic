<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Link interceptor harness</title>
<script>
  // Stub the VS Code webview API so the interceptor's acquireVsCodeApi() works
  // and outbound messages are recorded for assertions (mirrors canvas-harness).
  window.__posted = [];
  window.acquireVsCodeApi = () => ({
    postMessage: (m) => { window.__posted.push(m); },
    getState: () => undefined,
    setState: () => undefined,
  });
</script>
</head>
<!-- data-scroll-to is what rewriteForWebview bakes onto <body> when a panel is
     opened by following a cross-artifact link (spec 020 T-011). -->
<body data-scroll-to="SC-002">
  <a id="link" href="#" data-artifact-link="../001-x/spec.html" data-anchor="SC-002">cross-artifact link</a>
  <div style="height:2400px"></div>
  <h3 id="SC-002">SC-002 target</h3>

  <!-- This script is kept identical to LINK_INTERCEPTOR in
       packages/vscode/src/host/open-artifact.ts (the string the host injects).
       The vitest test asserts the host emits it; this harness exercises it. -->
  <script>(()=> {
    var vscode = acquireVsCodeApi();
    document.addEventListener('click', (e)=> {
      var t = e.target;
      var a = t && t.closest ? t.closest('a[data-artifact-link]') : null;
      if(!a) return;
      e.preventDefault();
      vscode.postMessage({ type:'openLink', link: a.getAttribute('data-artifact-link'), anchor: a.getAttribute('data-anchor') || '' });
    }, true);
    function scrollToTarget(){
      var id = document.body && document.body.dataset ? document.body.dataset.scrollTo : '';
      if(!id) return;
      var el = document.getElementById(id);
      if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
    }
    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', ()=> { setTimeout(scrollToTarget, 0); });
    } else { setTimeout(scrollToTarget, 0); }
  })();</script>
</body>
</html>
