<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fixture · spec-flow render</title>
<link rel="stylesheet" href="../../assets/spec.css">
<script src="../../assets/theme-boot.js"></script>
</head>
<body>
<main>
  <p class="small-caps">Fixture · spec-flow render</p>

<spec-screen id="convert"></spec-screen>
<spec-screen id="pairs"></spec-screen>

<spec-flow id="convert-a-figure">
  <spec-step id="s1" screen="convert" state="empty"></spec-step>
  <spec-step id="s2" screen="pairs">
    <spec-branch id="b1" to="convert">The sheet is dismissed without a choice, so the amount stands and no rate is fetched.</spec-branch>
  </spec-step>
  <spec-step id="s3" screen="convert" state="converted"></spec-step>
  <spec-step id="s4" outward>Leaves for the receipt, which another feature owns.</spec-step>
</spec-flow>

<spec-flow id="broken">
  <spec-step id="s-bad"></spec-step>
</spec-flow>
</main>
<script src="../../assets/spec.js"></script>
</body>
</html>
