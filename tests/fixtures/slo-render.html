<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLO render fixture · Specification</title>
<link rel="stylesheet" href="../../assets/spec.css">
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<script src="../../assets/theme-boot.js"></script>
</head>
<body>
<main>

<header>
  <p class="small-caps">Fixture · spec-slo render + click-through</p>
  <h1>SLO render fixture</h1>
</header>

<section id="top">
<h2>The NFR (near the top of the page)</h2>
<spec-requirement id="NFR-001" priority="must">
<p>p95 latency &lt; 200 ms.</p>
</spec-requirement>
</section>

<!-- Filler tall enough to push the <spec-slo> below the fold, so a click-through
     scroll is meaningfully testable (not a no-op because it's already in view). -->
<div style="height: 2200px;" aria-hidden="true"></div>

<section id="bottom">
<h2>The SLO (far below the fold)</h2>
<spec-slo id="the-slo" target="NFR-001" signal="latency" objective="99% &lt; 200ms" window="28d" budgeting="occurrences">
  fraction of requests served in &lt; 200 ms (good ÷ valid)
</spec-slo>
</section>

</main>
<script src="../../assets/spec.js"></script>
</body>
</html>
