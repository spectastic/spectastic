<body>
<main>
  <p class="small-caps">Fixture · choreography render</p>

<spec-choreography id="entrance" origin="first paint">
  <spec-reduced-motion id="rm">Skipped entirely — every element is in its final position on the first frame.</spec-reduced-motion>
  <spec-cue id="c1" element="eyebrow" at="0ms" duration="220ms"></spec-cue>
  <spec-cue id="c2" element="heading" at="180ms"></spec-cue>
  <spec-cue id="c3" element="mark" at="1080ms" duration="550ms"></spec-cue>
</spec-choreography>

<spec-choreography id="broken">
  <spec-reduced-motion id="rm-empty"></spec-reduced-motion>
  <spec-cue id="c-bad" element="orphan"></spec-cue>
</spec-choreography>
</main>
<script src="../../assets/spec.js"></script>
