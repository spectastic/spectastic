<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fixture · component states render</title>
<link rel="stylesheet" href="../../assets/spec.css">
<script src="../../assets/theme-boot.js"></script>
</head>
<body>
<main>
  <p class="small-caps">Fixture · component states render</p>

<spec-component name="rate-line" origin="authored">
  <spec-cstate id="declared" name="resting"></spec-cstate>
  <spec-cstate id="declined" name="hover" declined>It is a live region, not a control; nothing hovers it.</spec-cstate>
  <spec-cstate id="noreason" name="pressed" declined></spec-cstate>
  <spec-cstate id="noname" declined>A state that forgot to say which one it is.</spec-cstate>
  <spec-transition id="t1" from="resting" to="hover" trigger="the pointer enters"></spec-transition>
</spec-component>
</main>
<script src="../../assets/spec.js"></script>
</body>
</html>
