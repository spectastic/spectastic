<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>positive fixture · date-format</title></head>
<body><main>
<section>
<h2>Dates</h2>

<!-- ISO display text over an ISO datetime — the visible text must be DD Mon YYYY, not ISO. Must warn. -->
<p>Created <time datetime="2026-06-29">2026-06-29</time></p>

<!-- Non-ISO datetime attribute — the machine value must be ISO 8601. Must warn. -->
<p>Ratified <time datetime="29 Jun 2026">29 Jun 2026</time></p>

<!-- Unpadded single-digit day — DD is zero-padded two digits. Must warn (the risk-1 boundary). -->
<p>Updated <time datetime="2026-07-06">6 Jul 2026</time></p>

</section>
</main></body></html>
