<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>decision-well-formed fixture (triggers) · Design</title>
</head>
<body>
<main>
<h1>Fixture</h1>

<!-- V1: illegal status -->
<spec-decision id="D-101" status="maybe">
  <spec-reason>x</spec-reason>
  <h4>D-101</h4>
</spec-decision>

<!-- V2: illegal posture (valid scope so only posture fires) -->
<spec-decision id="D-102" status="accepted" posture="soft">
  <spec-scope><spec-path>src/a/**</spec-path></spec-scope>
  <spec-reason>x</spec-reason>
  <h4>D-102</h4>
</spec-decision>

<!-- V3: accepted, block-default (no posture), no scope path -->
<spec-decision id="D-103" status="accepted">
  <spec-reason>x</spec-reason>
  <h4>D-103</h4>
</spec-decision>

<!-- V4: enforcement present but neither a valid rule nor a none -->
<spec-decision id="D-104" status="accepted" posture="block">
  <spec-scope><spec-path>src/d104/**</spec-path></spec-scope>
  <spec-enforcement></spec-enforcement>
  <spec-reason>x</spec-reason>
  <h4>D-104</h4>
</spec-decision>

<!-- V5: a none enforcement missing its reason -->
<spec-decision id="D-105" status="accepted" posture="block">
  <spec-scope><spec-path>src/d105/**</spec-path></spec-scope>
  <spec-enforcement><spec-none></spec-none></spec-enforcement>
  <spec-reason>x</spec-reason>
  <h4>D-105</h4>
</spec-decision>

<!-- V6 (FR-005): two active decisions overlap the same path with no supersedes between them -->
<spec-decision id="D-106" status="accepted" posture="block">
  <spec-scope><spec-path>src/shared/**</spec-path></spec-scope>
  <spec-enforcement><spec-rule tool="archunit" id="r_106"></spec-rule></spec-enforcement>
  <spec-reason>x</spec-reason>
  <h4>D-106</h4>
</spec-decision>
<spec-decision id="D-107" status="accepted" posture="block">
  <spec-scope><spec-path>src/shared/**</spec-path></spec-scope>
  <spec-enforcement><spec-rule tool="archunit" id="r_107"></spec-rule></spec-enforcement>
  <spec-reason>x</spec-reason>
  <h4>D-107</h4>
</spec-decision>

</main>
</body>
</html>
