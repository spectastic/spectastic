<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>flow-resolves · negative</title></head>
<body>
<main>
<section id="resolvable">
<h2>Journeys that resolve, including the shapes that must stay silent</h2>

<spec-screen id="convert"></spec-screen>
<spec-screen id="pairs"></spec-screen>

<spec-flow id="convert-a-figure">
  <spec-step screen="convert" state="empty"></spec-step>
  <spec-step screen="pairs">
    <spec-branch to="convert">The sheet is dismissed without a choice.</spec-branch>
  </spec-step>
  <!-- A cycle: the converter clears and is used again. Ordinary, and reported
       by nothing — the precedence graph's reading of the word does not apply. -->
  <spec-step screen="convert" state="converted"></spec-step>
  <!-- A declared boundary, which resolves to nothing on purpose. -->
  <spec-step outward>Leaves for the receipt, which another feature owns.</spec-step>
</spec-flow>

<!-- A step with no branch: not recorded, never "no failure is possible". -->
<spec-flow id="minimal">
  <spec-step screen="convert"></spec-step>
</spec-flow>
</section>
</main>
</body>
</html>
