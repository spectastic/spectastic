<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>contract-name-unique fixture (colliding) · Specification</title>
</head>
<body>
<main>
<h1>Fixture</h1>

<!-- Two versioned contracts of one API. The directory is discarded before the
     coordinate name is formed, so both resolve to "openapi" and a downstream
     reference cannot tell them apart (076 FR-007). This is the ordinary shape
     of a versioned interface, not a corner case. -->
<spec-contract shape="request-response" path="api/v1/openapi.yaml" format="openapi">
  <p>Version 1 of the orders API.</p>
</spec-contract>
<spec-contract shape="request-response" path="api/v2/openapi.yaml" format="openapi">
  <p>Version 2 of the orders API.</p>
</spec-contract>

</main>
</body>
</html>
