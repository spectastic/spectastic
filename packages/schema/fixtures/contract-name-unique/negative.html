<!doctype html>
<html lang="en">

<meta charset="utf-8">
<title>contract-name-unique fixture (clean) · Specification</title>

<body>
<main>
<h1>Fixture</h1>

<!-- The same two versioned contracts, with the collision resolved the way the
     grammar always allowed: an explicit name= wins over the basename fallback.
     What 076 FR-007 changed is that something now asks for it. -->
<spec-contract shape="request-response" name="orders-v1" path="api/v1/openapi.yaml" format="openapi">
  <p>Version 1 of the orders API.</p>
</spec-contract>
<spec-contract shape="request-response" name="orders-v2" path="api/v2/openapi.yaml" format="openapi">
  <p>Version 2 of the orders API.</p>
</spec-contract>

<!-- Distinct basenames need no explicit name: the fallback already discriminates. -->
<spec-contract shape="event-driven" direction="publishes" path="api/events.yaml" format="asyncapi">
  <p>Order lifecycle events.</p>
</spec-contract>

</main>
</body>
</html>
