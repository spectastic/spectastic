<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>choreography · negative</title></head>
<body>
<main>
<section id="well-formed">
<h2>Choreographies that are complete, including the shapes that must stay silent</h2>

<spec-choreography id="entrance" origin="first paint">
  <spec-reduced-motion>Skipped entirely — every element is in its final position on the first frame, and no value animates.</spec-reduced-motion>
  <spec-cue element="eyebrow" at="0ms" duration="{motion.entrance}" easing="{motion.ease-out}"></spec-cue>
  <!-- Two cues at the same offset: deliberate simultaneity, reported by
       nothing. Requiring a difference would have an author invent one. -->
  <spec-cue element="heading" at="180ms" duration="220ms" easing="ease-out"></spec-cue>
  <spec-cue element="mark" at="180ms" duration="550ms"></spec-cue>
</spec-choreography>

<!-- Origins other than first paint: a sequence may start from a response. -->
<spec-choreography id="on-refresh" origin="the rate response arriving">
  <spec-reduced-motion>The figure changes without the cross-fade.</spec-reduced-motion>
  <spec-cue element="rate-line" at="0ms" duration="220ms"></spec-cue>
</spec-choreography>
</section>
</main>
</body>
</html>
