<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>tracking-plan-shape · negative</title></head>
<body>
<main>
<section id="well-formed">
<h2>A plan a reviewer can answer yes or no to</h2>

<spec-consent-gate question="Q-04" answer=""></spec-consent-gate>

<spec-screen id="convert">
  <!-- No fields: this event carries no payload, which is a positive claim and
       the safest kind of event. Reported by nothing. -->
  <spec-event name="screen_seen"></spec-event>

  <spec-state id="converted" source="derived" from="200">
    <spec-annotation target="convert-button" layer="tracking">
      <spec-event name="rate_converted">
        <spec-field name="pair" type="string"></spec-field>
        <!-- The distinction a privacy review turns on: a pair is a choice from
             a fixed list, an amount is something a person typed. -->
        <spec-field name="amount" type="number" from-user-input></spec-field>
      </spec-event>
    </spec-annotation>
  </spec-state>
</spec-screen>
</section>
</main>
</body>
</html>
