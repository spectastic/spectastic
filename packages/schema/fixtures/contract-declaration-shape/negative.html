<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>contract-declaration-shape fixture (clean) · Specification</title>
</head>
<body>
<main>
<h1>Fixture</h1>

<!-- Well-formed no-interface declaration: shape="none" needs no path=/format=. -->
<spec-contract shape="none">
  <p>No interface exposed by this feature.</p>
</spec-contract>

<!-- Well-formed declared interface: a recognised shape with both path= and format=.
     This entry also serves 077-event-schema-evolution's "a non-event contract carrying
     neither [compatibility attribute]" case — a request-response declaration legitimately
     carries no compatibility=/compatibility-scope= at all. -->
<spec-contract shape="request-response" path="api/openapi.yaml" format="openapi">
  <p>Consumers may rely on the settlements resource and its 4xx error envelope.</p>
</spec-contract>

<!-- Well-formed event-driven declaration carrying a compatibility stance (077-event-schema-evolution,
     D-001): a recognised direction (compatibility=) paired with a recognised scope
     (compatibility-scope=). -->
<spec-contract shape="event-driven" direction="publishes" path="asyncapi.yaml" format="asyncapi"
                compatibility="backward" compatibility-scope="all">
  <p>Publishes a settlement.completed event per window close; readers on the new schema can
  read all previously published messages.</p>
</spec-contract>

<!-- The "zero <spec-contract> elements" early-return branch is exercised directly in
     contract-declaration-shape.test.ts against a plain document, not here — this file's
     job is proving the rule stays silent on well-formed elements, not on their absence. -->
</main>
</body>
</html>
