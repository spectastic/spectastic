<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>component-states · negative</title></head>
<body>
<main>
<section id="accounted-for">
<h2>Components that account for every expected state, and the two exemptions</h2>

<spec-component name="convert-button" origin="authored">
  <spec-cstate name="resting"></spec-cstate>
  <spec-cstate name="hover"></spec-cstate>
  <spec-cstate name="focus-visible"></spec-cstate>
  <spec-cstate name="pressed"></spec-cstate>
  <spec-cstate name="disabled"></spec-cstate>
  <spec-cstate name="loading"></spec-cstate>
  <spec-cstate name="success"></spec-cstate>
  <spec-cstate name="error"></spec-cstate>
  <spec-cstate name="empty"></spec-cstate>
  <spec-transition from="resting" to="hover" on="the pointer enters"></spec-transition>
  <spec-transition from="hover" to="pressed" on="the pointer goes down"></spec-transition>
</spec-component>

<!-- A decline is an account, not a gap — with a reason, which is content
     rather than an attribute so an empty string cannot satisfy it. -->
<spec-component name="rate-line" origin="authored">
  <spec-cstate name="resting"></spec-cstate>
  <spec-cstate name="hover" declined>It is a live region, not a control; nothing hovers it.</spec-cstate>
  <spec-cstate name="focus-visible" declined>Not focusable — it announces rather than receives.</spec-cstate>
  <spec-cstate name="pressed" declined>Not a control.</spec-cstate>
  <spec-cstate name="disabled" declined>It has no interactive affordance to disable.</spec-cstate>
  <spec-cstate name="loading"></spec-cstate>
  <spec-cstate name="success"></spec-cstate>
  <spec-cstate name="error"></spec-cstate>
  <spec-cstate name="empty"></spec-cstate>
</spec-component>

<!-- Exempt entirely: a divider declining nine states would be nine lines
     carrying one fact. -->
<spec-component name="divider" origin="authored" non-interactive></spec-component>

<!-- Exempt: its states belong to whoever wrote it. -->
<spec-component name="Button" origin="consumed" origin-url="https://example.invalid/ui" edition="4.2.0" license="MIT"></spec-component>
</section>
</main>
</body>
</html>
