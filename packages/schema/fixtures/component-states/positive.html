<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>component-states · positive</title></head>
<body>
<main>
<section id="incomplete">
<h2>Components that account for neither declaring nor declining</h2>

<spec-component name="convert-button" origin="authored">
  <spec-cstate name="resting"></spec-cstate>
  <spec-cstate name="hover"></spec-cstate>
</spec-component>

<spec-component name="amount-field" origin="authored">
  <spec-cstate name="resting"></spec-cstate>
  <spec-cstate name="hover"></spec-cstate>
  <spec-cstate name="focus-visible"></spec-cstate>
  <spec-cstate name="pressed"></spec-cstate>
  <spec-cstate name="disabled"></spec-cstate>
  <spec-cstate name="loading"></spec-cstate>
  <spec-cstate name="success"></spec-cstate>
  <spec-cstate name="error"></spec-cstate>
  <spec-cstate name="empty"></spec-cstate>
  <spec-cstate name="loading" declined></spec-cstate>
  <spec-transition from="resting" to="expanded"></spec-transition>
</spec-component>
</section>
</main>
</body>
</html>
