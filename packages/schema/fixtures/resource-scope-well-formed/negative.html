<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>resource-scope well-formed · fixture</title></head>
<body>
<main>

<!-- A well-formed resource scope: datastore coordinate, owner-qualified owner
     that agrees with the coordinate's authority, an owner-internal allowed path. -->
<spec-decision id="D-007" status="accepted" posture="block">
  <h4>D-007 — only the position-keeper service writes the positions store</h4>
  <spec-scope>
    <spec-resource coordinate="spectastic://position-keeper/position-keeper/datastore/positions"
      owner="position-keeper/position-keeper" allowed-in="src/**/persistence/**"></spec-resource>
  </spec-scope>
  <spec-reason>Every position change must emit PositionChanged; the positions store belongs to the position-keeper service.</spec-reason>
  <spec-enforcement>
    <spec-rule tool="native-content" id="no_positions_write" pattern="UPDATE\s+positions"></spec-rule>
  </spec-enforcement>
</spec-decision>

<!-- A plain path-scoped decision (no resource) must never trip this rule. -->
<spec-decision id="D-008" status="accepted" posture="block">
  <h4>D-008 — a path-scoped decision</h4>
  <spec-scope><spec-path>src/**/persistence/**</spec-path></spec-scope>
  <spec-reason>no direct writes outside the adapter</spec-reason>
</spec-decision>

</main>
</body></html>
