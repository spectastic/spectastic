<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>resource-scope malformed · fixture</title></head>
<body>
<main>

<!-- D-201: a malformed coordinate (not a spectastic:// URI at all). -->
<spec-decision id="D-201" status="accepted" posture="block">
  <h4>D-201 — bad coordinate</h4>
  <spec-scope>
    <spec-resource coordinate="positions-table" owner="acme/acme" allowed-in="src/**/persistence/**"></spec-resource>
  </spec-scope>
  <spec-reason>governs the positions store</spec-reason>
</spec-decision>

<!-- D-202: a well-formed coordinate but an ill-formed owner identity. -->
<spec-decision id="D-202" status="accepted" posture="block">
  <h4>D-202 — bad owner</h4>
  <spec-scope>
    <spec-resource coordinate="spectastic://acme/acme/datastore/positions" owner="Not A Valid Owner!!"></spec-resource>
  </spec-scope>
  <spec-reason>governs the positions store</spec-reason>
</spec-decision>

<!-- D-203: owner attribute disagrees with the coordinate's own authority. -->
<spec-decision id="D-203" status="accepted" posture="block">
  <h4>D-203 — owner/coordinate disagreement</h4>
  <spec-scope>
    <spec-resource coordinate="spectastic://position-keeper/position-keeper/datastore/positions" owner="acme/reconciliation-service"></spec-resource>
  </spec-scope>
  <spec-reason>governs the positions store</spec-reason>
</spec-decision>

</main>
</body></html>
