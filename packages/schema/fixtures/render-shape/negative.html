<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>render-shape · negative</title></head>
<body>
<main>
<section id="well-formed">
<h2>Renders that are well formed, and screens that declare none</h2>

<spec-screen id="convert">
  <spec-state id="converted" source="derived" from="200">
    <spec-render src="renders/converted-ios-light.png" contexts="platform=ios mode=light"></spec-render>
  </spec-state>

  <spec-state id="offline" source="authored">
    <!-- No contexts: evidence of the state it sits in, and nothing narrower. -->
    <spec-render src="renders/offline.png"></spec-render>
  </spec-state>

  <spec-state id="empty" source="authored">
    <p>A state with no evidence at all. A render is evidence a person looks at,
    never a dependency — its absence is not a gap and is never reported.</p>
  </spec-state>
</spec-screen>
</section>
</main>
</body>
</html>
