<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>slo-well-formed fixture (triggers) · Specification</title>
</head>
<body>
<main>
<h1>Fixture</h1>
<spec-requirement id="NFR-001" priority="must">
<p>p95 latency &lt; 200 ms.</p>
</spec-requirement>

<!-- V1: target= resolves to no NFR in this document -->
<spec-slo target="NFR-999" objective="99% &lt; 200ms" window="28d" budgeting="occurrences">
  fraction of requests served in &lt; 200 ms
</spec-slo>

<!-- V2: missing objective= -->
<spec-slo target="NFR-001" window="28d" budgeting="occurrences">
  fraction of requests served in &lt; 200 ms
</spec-slo>

<!-- V3: missing window= -->
<spec-slo target="NFR-001" objective="99% &lt; 200ms" budgeting="occurrences">
  fraction of requests served in &lt; 200 ms
</spec-slo>

<!-- V4: missing budgeting= -->
<spec-slo target="NFR-001" objective="99% &lt; 200ms" window="28d">
  fraction of requests served in &lt; 200 ms
</spec-slo>

<!-- V5: empty SLI content -->
<spec-slo target="NFR-001" objective="99% &lt; 200ms" window="28d" budgeting="occurrences"></spec-slo>

<!-- V6: unknown signal= value -->
<spec-slo target="NFR-001" signal="throughput" objective="99% &lt; 200ms" window="28d" budgeting="occurrences">
  fraction of requests served in &lt; 200 ms
</spec-slo>
</main>
</body>
</html>
