<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>negative fixture · task-title-bold-scope</title></head>
<body><main>
<header>
  <spec-meta>
    <b>Status</b><span><spec-status value="draft">Draft</spec-status></span>
  </spec-meta>
</header>

<section>
<h2>Tasks</h2>

<!-- Correct form: a short imperative <strong> title, then plain-weight detail
     after the em-dash. The <strong> does NOT span most of the row — clean. -->
<spec-task id="T-001">
  <input type="checkbox">
  <div><strong>Register the rule</strong> — append it to the rules array so <code>rules.test.ts</code> discovers its positive/negative fixtures and runs them. <span class="path">packages/schema/src/rules/index.ts</span></div>
</spec-task>

<!-- False-positive boundary (risk 1): a terse, detail-free title that
     legitimately fills its whole row and is correctly all-bold. The <strong>
     spans the row but there is no detail beyond the title (under the length
     floor) — must stay clean. -->
<spec-task id="T-002">
  <input type="checkbox">
  <div><strong>Wire up the CLI flag</strong> <span class="path">packages/cli/src/index.ts</span></div>
</spec-task>

<!-- False-positive boundary (risk 1): a short title carrying a colon. A bare
     colon is not a signal — must stay clean. -->
<spec-task id="T-003">
  <input type="checkbox">
  <div><strong>Add REQ-TOOL-004: triggering metadata</strong> <span class="path">commands/spectastic.spec.md</span></div>
</spec-task>

</section>

</main></body></html>
