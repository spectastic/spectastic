<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Malformed visual declarations · Design</title></head>
<body>
<main>
<header><p class="small-caps">Fixture · visual-declaration-shape</p><h1>Malformed visual declarations</h1></header>

<section id="visual">
<h2>1 · Visual surface</h2>

<!-- Every way a PRESENT declaration can be malformed (093 FR-009). -->

<spec-visual tokens="visual/tokens"><p>No shape at all.</p></spec-visual>

<spec-visual shape="mockups" tokens="visual/tokens"><p>A shape outside the vocabulary.</p></spec-visual>

<spec-visual shape="screens"><p>A surface with no tokens, no screens and no source.</p></spec-visual>

<spec-visual shape="screens" tokens-external="@acme/tokens"><p>An external base with nothing local to extend.</p></spec-visual>

<spec-visual shape="none" tokens="visual/tokens"><p>Declares no surface, then names one.</p></spec-visual>
</section>

</main>
</body>
