<header><p class="small-caps">Fixture · visual-declaration-shape</p><h1>Well-formed visual declarations</h1></header>

<section id="visual">
<h2>1 · Visual surface</h2>

<!-- Every legal form. The rule fires only on a PRESENT declaration that is
     malformed, so a document with no declaration at all is silent too — which
     is every design in the estate today. -->

<spec-visual shape="screens" tokens="visual/tokens" screens="specs/001-a/visual" source="Figma">
  <p>A declared surface naming both paths and its provenance.</p>
</spec-visual>

<spec-visual shape="screens" tokens="visual/tokens" tokens-external="@acme/tokens" screens="specs/002-b/visual" source="Penpot">
  <p>A local set that extends an external base.</p>
</spec-visual>

<spec-visual shape="none">
  <p>A feature inside an interface project that touches no screen.</p>
</spec-visual>
</section>

</main>
