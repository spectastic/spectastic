<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Asset-resolve fixture · Specification</title>

<!-- 1. present: resolves to a readable file -->
<link rel="stylesheet" href="../../assets/spec.css">
<!-- 2. absent -->
<link rel="stylesheet" href="../../assets/does-not-exist.css">
<!-- 3. a directory sits at the path -->
<link rel="stylesheet" href="../../assets/a-directory">
<!-- 4. absolute — reported without being resolved -->
<link rel="stylesheet" href="/etc/passwd">
<!-- 5. escapes the project root AND resolves: must stay SILENT (the nested-project
     case that made the cloned containment clause wrong — 091 REQ-FORMAT-010) -->
<link rel="stylesheet" href="../../../asset-resolve-outside.css">
<!-- 6-8. remote and inline schemes: out of reach -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato">
<script src="http://example.com/x.js"></script>
<script src="data:text/javascript,void+0"></script>
<!-- 9. present script -->
<script src="../../assets/theme-boot.js"></script>
<!-- 10. absent script -->
<script src="../../assets/missing-boot.js"></script>
</head>
<body>
<main>
<p>An image reference is never checked under this requirement (094 FR-005):</p>
<img src="renders/never-captured.svg" alt="a render that was never captured">

<p>Documenting a link is not making one. This escaped example must produce no finding,
which is what walking the AST buys over matching the source text:</p>
<pre><code>&lt;link rel="stylesheet" href="${ASSETS}/course.css"&gt;</code></pre>
</main>
</body>
</html>
