name: Bug report
description: Something in the CLI, the schema, or a generated artifact behaves wrongly.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The fields below are what triage needs to classify the fix to the
        layer that owns it — a schema rule, a verb kernel, a command, or the artifact itself.

        **Found a security problem?** Don't file it here — use
        [private reporting](https://github.com/spectastic/spectastic/security/advisories/new).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The failure as you observed it. Paste the error verbatim if there was one.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        The command you ran, and the smallest artifact that triggers it. A minimal
        spec-html snippet is far more useful than a whole file.
      render: html
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `spectastic --version`.
      placeholder: "0.1.0-pre.23"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Node version and OS
      description: Output of `node --version`, plus your operating system.
      placeholder: "v20.11.0, macOS 15.3"
    validations:
      required: true

  - type: textarea
    id: validate-output
    attributes:
      label: Validator output
      description: >
        If the report involves an artifact, paste `spectastic validate --format json <path>`.
        Optional, but it usually identifies the owning rule immediately.
      render: json
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I reproduced this on the latest published version.
          required: true
        - label: I searched existing issues for the same failure.
          required: true
