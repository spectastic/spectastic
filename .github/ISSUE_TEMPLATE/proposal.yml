name: Methodology change or feature proposal
description: Propose a change to the lifecycle, the element vocabulary, or a verb's behaviour.
labels: ["proposal", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This is where a **direction** gets agreed. An approved direction then becomes a change
        proposal authored with `/spectastic.propose`, which carries the typed deltas and risk
        register that `/spectastic.apply` depends on.

        **Please don't open a PR editing a spec directly.** A non-trivial change that arrives as a
        raw spec edit will be asked to re-route, which wastes your time and ours. See the routing
        table in [CONTRIBUTING.md](https://github.com/spectastic/spectastic/blob/main/CONTRIBUTING.md).

  - type: textarea
    id: intent
    attributes:
      label: What should change, and why now
      description: The problem first. What breaks, or what stays impossible, without this.
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Which spec does this target
      description: A directory under `specs/`, or "new" if this needs a spec of its own.
      placeholder: "042-profile-enforcement, or: new"
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: How big is it
      options:
        - Small and revert-safe — one file, no contract change
        - Non-trivial — changes a requirement, a contract, or a verb's behaviour
        - Not sure
    validations:
      required: true

  - type: textarea
    id: prior-art
    attributes:
      label: What you have already read or tried
      description: >
        Relevant specs, a considerations doc under `docs/`, an approach you ruled out. This is the
        section that most often changes the answer.
    validations:
      required: false
