name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write  # for SARIF upload

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version is pinned in root package.json's `packageManager` field;
      # pnpm/action-setup reads it from there. Don't duplicate here — pnpm 9+
      # refuses if both sources declare a version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Build first so cross-package types (.d.ts) are emitted; the cli's
      # typecheck depends on @spectastic/schema's emitted types to resolve
      # the workspace dependency.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test

      - name: Perf bench — catch order-of-magnitude regressions
        # Budgets live in bench/baselines.json and are permissive on
        # purpose; they fail when something heavy was eager-loaded on a
        # path that should stay lazy, not when a Node minor bump shifts
        # cold-start by 10ms. Raise budgets deliberately when they tighten;
        # never quietly relax.
        run: pnpm bench

      - name: Dogfood — validate the repo's own spec-html artifacts
        run: |
          node packages/cli/bin/spectastic validate \
            --format sarif \
            "specs/**/*.html" \
            "examples/*.html" \
            "principles.html" \
            "plan.html" \
            "inbox.html" \
            "index.html" \
            > spectastic.sarif || true

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: spectastic.sarif
          category: spectastic-dogfood

  # A distinct, required status check for the artifact-security layer (spec
  # 045 built the controls; spec 046 red-teams them). This FAILS THE BUILD on
  # any executable-content finding — unlike the advisory dogfood above, which
  # stays SARIF-only. The two are kept separate on purpose: a structural finding
  # never turns this job red, and a security finding is never merely logged.
  security-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build

      # Two hard gates:
      #  · the adversarial red-team — a hostile artifact carrying the full
      #    injection battery is caught (categorical vectors blocked; hidden-channel
      #    vectors documented as the deferred 045 FR-004 gap);
      #  · the corpus-clean scan — no shipped artifact carries executable content.
      # Both assert only on the no-executable-content rule, so they can't be
      # tripped by an unrelated structural finding.
      - name: Adversarial red-team + corpus security scan (hard gate)
        run: >
          pnpm vitest run
          packages/schema/test/injection-red-team.test.ts
          packages/cli/test/security-corpus.test.ts
