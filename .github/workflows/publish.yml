name: Publish

# Two jobs share most of the gate logic (install + typecheck + tests + build).
# - dry-run: runs on PRs touching this file; exercises the publish path via
#            `pnpm publish --dry-run` without writing to npm. Per D-003.
# - publish: runs on `v*` tag pushes; the real publish with --provenance
#            via OIDC. Per D-001 and FR-001..FR-008 of spec 004.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/publish.yml'

env:
  NODE_VERSION: '20'
  # pnpm version is pinned in root package.json's `packageManager` field;
  # pnpm/action-setup reads it from there. Don't duplicate here — pnpm 9+
  # refuses if both sources declare a version.

jobs:
  # T-100: dry-run validates the workflow file on PRs that touch it.
  # Same gates as publish, plus `pnpm publish --dry-run` to exercise
  # workspace:* rewriting, package contents, and manifest validation.
  dry-run:
    name: Dry-run (PR validation)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ripgrep: keep the corpus grep read-path's rg/Node parity coverage live in
      # the publish gate too (matches ci.yml; triage 064 T-001).
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first so cross-package types (.d.ts) are emitted; the cli's
      # typecheck depends on @spectastic/schema's emitted types to resolve
      # the workspace dependency. Build itself typechecks each package via
      # tsup; the explicit typecheck step below is a redundant safety net.
      - name: Build (includes prebuild)
        run: pnpm -r build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Dry-run omits --provenance because it's not actually publishing; the
      # publish job uses --provenance with OIDC.
      - name: Dry-run publish
        run: pnpm publish --dry-run -r --access public --no-git-checks

  # T-010 / T-012 / T-110 / T-111 / T-112: real publish on `v*` tag push.
  publish:
    name: Publish to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # required for npm --provenance via GitHub OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      # ripgrep: keep the corpus grep read-path's rg/Node parity coverage live in
      # the publish gate too (matches ci.yml; triage 064 T-001).
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first so cross-package types (.d.ts) are emitted; the cli's
      # typecheck depends on @spectastic/schema's emitted types to resolve
      # the workspace dependency. Build itself typechecks each package via
      # tsup; the explicit typecheck step below is a redundant safety net.
      - name: Build (includes prebuild)
        run: pnpm -r build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # T-012: verify the pushed tag matches every published package's version.
      # Refuses if any differ from the tag-derived version. Per FR-003 of
      # 004-npm-publish-workflow, extended for @spectastic/core by FR-011 of
      # 006-kernel-extraction, and for @spectastic/corpus by 064-corpus-package-
      # extraction (a version-check gap here would let a new package ship at a
      # stale/mismatched version silently — it is not covered by pnpm publish -r
      # actually publishing it, only by this explicit check).
      - name: Verify versions match tag
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          SCHEMA_VERSION=$(node -p "require('./packages/schema/package.json').version")
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          CORPUS_VERSION=$(node -p "require('./packages/corpus/package.json').version")

          echo "Tag version:    $TAG_VERSION"
          echo "CLI version:    $CLI_VERSION"
          echo "Schema version: $SCHEMA_VERSION"
          echo "Core version:   $CORE_VERSION"
          echo "Corpus version: $CORPUS_VERSION"

          if [[ "$CLI_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::@spectastic/cli version ($CLI_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          if [[ "$SCHEMA_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::@spectastic/schema version ($SCHEMA_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          if [[ "$CORE_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::@spectastic/core version ($CORE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          if [[ "$CORPUS_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::@spectastic/corpus version ($CORPUS_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      # Derive the dist-tag set. Keyed on whether a STABLE release exists, not on
      # the version string: while none does, a pre-release moves both `next` and
      # `latest` so the documented bare install resolves to the newest build; the
      # guard engages by itself once 1.0.0 ships. Promoted out of an inline bash
      # conditional (D-005 pre-authorised this once the rule outgrew "contains a
      # hyphen"), so every branch is unit-tested rather than first run live.
      # A registry state that can't be determined fails here — never guess a tag.
      - name: Derive dist-tag
        id: dist-tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAGS=$(node scripts/derive-dist-tag.mjs "$VERSION" "@spectastic/cli")
          PRIMARY=$(echo "$TAGS" | head -n1)
          EXTRA=$(echo "$TAGS" | tail -n +2 | tr '\n' ' ')

          echo "Dist-tags: $(echo "$TAGS" | tr '\n' ' ')"
          echo "primary=$PRIMARY"            >> "$GITHUB_OUTPUT"
          echo "extra=$EXTRA"                >> "$GITHUB_OUTPUT"
          echo "all=$(echo "$TAGS" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # T-111: real publish with --provenance via OIDC. NPM_TOKEN is a
      # granular-access token scoped to publishing @spectastic/*. Per FR-004,
      # FR-005, NFR-002.
      - name: Publish to npm
        run: |
          pnpm publish -r \
            --provenance \
            --access public \
            --tag ${{ steps.dist-tag.outputs.primary }} \
            --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Move any additional tags the derivation asked for (pre-stable: `latest`
      # alongside `next`). All three packages move together — their `latest`
      # values had already drifted apart at pre.3 / pre.8. `set -e` plus the
      # explicit failure means a half-tagged release goes red rather than
      # reporting success while the install command still serves an old build.
      - name: Move additional dist-tags
        if: steps.dist-tag.outputs.extra != ''
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          for TAG in ${{ steps.dist-tag.outputs.extra }}; do
            for PKG in @spectastic/cli @spectastic/core @spectastic/schema @spectastic/corpus; do
              echo "dist-tag add $PKG@$VERSION $TAG"
              npm dist-tag add "$PKG@$VERSION" "$TAG"
            done
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # T-112: workflow summary block listing published versions + npmjs.com
      # links. Surfaces what just shipped without scrolling the run log. Per
      # FR-008.
      - name: Workflow summary
        if: success()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ALL_TAGS="${{ steps.dist-tag.outputs.all }}"
          PRIMARY="${{ steps.dist-tag.outputs.primary }}"
          # Every tag that moved, not just the one passed to `pnpm publish` — a
          # summary naming a single tag would misdescribe a two-tag release.
          TAG_LIST=$(echo "$ALL_TAGS" | sed 's/ *$//; s/ /`, `/g')
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Published v$VERSION on \`$TAG_LIST\`

          - [@spectastic/cli@$VERSION](https://www.npmjs.com/package/@spectastic/cli/v/$VERSION)
          - [@spectastic/core@$VERSION](https://www.npmjs.com/package/@spectastic/core/v/$VERSION)
          - [@spectastic/schema@$VERSION](https://www.npmjs.com/package/@spectastic/schema/v/$VERSION)
          - [@spectastic/corpus@$VERSION](https://www.npmjs.com/package/@spectastic/corpus/v/$VERSION)

          Install:

          \`\`\`sh
          npm i -g @spectastic/cli@$PRIMARY
          \`\`\`

          Provenance attestation visible on each version page.
          EOF
