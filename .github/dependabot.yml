version: 2

updates:
  # Bump pinned third-party GitHub Actions in our workflows.
  # Per D-002 of specs/004-npm-publish-workflow/design.html, we pin to major
  # version tags (e.g. actions/checkout@v4); Dependabot opens PRs when a
  # new major lands so we can review and bump deliberately.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  # npm dependencies for the pnpm-workspace monorepo. Dependabot scans
  # the lockfile-style we use; security updates apply to dev + runtime.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    # Grouping, not noise reduction for its own sake: thirteen separate PRs
    # accumulated here, and the Playwright bump arrived as two PRs that could
    # not be evaluated apart — the root `@playwright/test` range and the exact
    # `playwright` pin in packages/render must move together or the test runner
    # and the browser driver are out of step, so each half failed on its own.
    # A group makes that bump one reviewable change. The dev/types groups keep
    # routine bumps from burying the ones that need a real decision.
    groups:
      # Deliberately NOT restricted by update-types: the whole reason this group
      # exists is that these versions must move in lockstep, and that applies to
      # a major just as much as a patch. A major arriving here still arrives as
      # one reviewable change.
      playwright:
        patterns:
          - 'playwright'
          - '@playwright/test'
          - '@axe-core/playwright'
      # The two groups below are minor+patch only, so a major is never bundled
      # with unrelated routine bumps and always arrives as its own PR. This is
      # the same posture the github-actions ecosystem above already takes --
      # review and bump majors deliberately -- and it is the lesson from the
      # first version of this config, which had no such restriction and promptly
      # produced one PR carrying TypeScript 6, Vitest 5, @vitest/coverage-v8 5,
      # dependency-cruiser 18 and @vscode/vsce 4 together. Grouping is meant to
      # stop routine bumps burying the risky ones, not to bundle four majors
      # into a single unmergeable change.
      types:
        update-types:
          - minor
          - patch
        patterns:
          - '@types/*'
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - 'playwright'
          - '@playwright/test'
          - '@axe-core/playwright'
          - '@types/*'
