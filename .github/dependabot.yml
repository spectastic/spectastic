version: 2

updates:
  # Bump pinned third-party GitHub Actions in our workflows.
  # Per D-002 of specs/004-npm-publish-workflow/design.html, we pin to major
  # version tags (e.g. actions/checkout@v4); Dependabot opens PRs when a
  # new major lands so we can review and bump deliberately.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  # npm dependencies for the pnpm-workspace monorepo. Dependabot scans
  # the lockfile-style we use; security updates apply to dev + runtime.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    # Grouping, not noise reduction for its own sake: thirteen separate PRs
    # accumulated here, and the Playwright bump arrived as two PRs that could
    # not be evaluated apart — the root `@playwright/test` range and the exact
    # `playwright` pin in packages/render must move together or the test runner
    # and the browser driver are out of step, so each half failed on its own.
    # A group makes that bump one reviewable change. The dev/types groups keep
    # routine bumps from burying the ones that need a real decision.
    groups:
      playwright:
        patterns:
          - 'playwright'
          - '@playwright/test'
          - '@axe-core/playwright'
      types:
        patterns:
          - '@types/*'
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - 'playwright'
          - '@playwright/test'
          - '@axe-core/playwright'
          - '@types/*'
